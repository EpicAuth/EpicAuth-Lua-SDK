name: Publish to LuaRocks & GitHub Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      LUAROCKS_API_KEY: ${{ secrets.LUAROCKS_API_KEY }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Lua
        uses: leafo/gh-actions-lua@v13
        with:
          luaVersion: "5.1"

      - name: Setup LuaRocks
        uses: leafo/gh-actions-luarocks@v4

      - name: Install Upload Dependencies
        run: |
          luarocks install dkjson

      - name: Resolve Environment & Rockspec
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="${TAG_NAME#v}"
            ROCKSPEC="epicauth-${VERSION}-1.rockspec"
            if [ ! -f "$ROCKSPEC" ]; then
              ROCKSPEC=$(ls epicauth-*.rockspec 2>/dev/null | grep -v scm | head -n 1)
            fi
          else
            VERSION="source"
            ROCKSPEC=$(ls epicauth-*.rockspec 2>/dev/null | grep -v scm | head -n 1)
          fi
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_ENV
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "ROCKSPEC=$ROCKSPEC" >> $GITHUB_ENV
          echo "Resolved TAG_NAME: $TAG_NAME"
          echo "Resolved VERSION: $VERSION"
          echo "Resolved ROCKSPEC: $ROCKSPEC"

      - name: Verify Rockspec
        run: |
          luarocks lint "$ROCKSPEC"

      - name: Build Single-File Bundle
        run: |
          lua scripts/bundle.lua

      - name: Package Source Archives
        run: |
          ARCHIVE_ZIP="epicauth-lua-sdk-${VERSION}.zip"
          ARCHIVE_TAR="epicauth-lua-sdk-${VERSION}.tar.gz"
          zip -r "$ARCHIVE_ZIP" epicauth.lua src/ dist/ LICENSE README.md
          tar -czf "$ARCHIVE_TAR" epicauth.lua src/ dist/ LICENSE README.md
          cp "$ARCHIVE_ZIP" epicauth-lua-sdk-source.zip
          cp "$ARCHIVE_TAR" epicauth-lua-sdk-source.tar.gz

      - name: Upload Release Assets to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/epicauth.bundle.lua
            epicauth-lua-sdk-source.zip
            epicauth-lua-sdk-source.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to LuaRocks
        if: env.LUAROCKS_API_KEY != ''
        run: |
          ROCKSPEC=$(ls epicauth-*.rockspec | grep -v scm | head -n 1)
          fi
          echo "Uploading $ROCKSPEC to LuaRocks..."
          luarocks upload "$ROCKSPEC" --api-key="$LUAROCKS_API_KEY"
